# SPDX-License-Identifier: Apache-2.0

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# MPU6050 sensor
CONFIG_SENSOR=y
CONFIG_MPU6050=y
CONFIG_MPU6050_TRIGGER_NONE=y

# PWM for motors
CONFIG_PWM=y

# ADC for battery
CONFIG_ADC=y

# UART for Bluetooth
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# I2C for IMU
CONFIG_I2C=y

# GPIO for LEDs
CONFIG_GPIO=y

# Watchdog
CONFIG_WATCHDOG=y

# Floating point
CONFIG_FPU=y

# Main thread stack (default 1024 is too small for calibration + PID)
CONFIG_MAIN_STACK_SIZE=2048
